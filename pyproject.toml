[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SpyDust"
dynamic = ["version"]
description = "A code for modeling spinning dust radiation"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "Zheng Zhang", email = "zheng.zhang@manchester.ac.uk"}
]
keywords = ["astrophysics", "astronomy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy<2.4",
    "scipy",
    "mpi4py",
]

[project.optional-dependencies]
plot = ["matplotlib"]
notebooks = ["jupyter", "matplotlib", "pandas", "scikit-learn", "seaborn"]

[project.urls]
Homepage = "https://github.com/SpyDust/SpyDust"

[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "SpyDust.__version__"}

[tool.setuptools.packages.find]
include = ["SpyDust*"]
exclude = ["paper-products*", "*.egg-info*"]

[tool.setuptools.package-data]
SpyDust = ["Data_Files/*"]
